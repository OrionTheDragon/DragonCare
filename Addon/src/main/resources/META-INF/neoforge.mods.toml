modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "dragoncare"
version = "${version}"
displayName = "Dragon Care"
authors = "OrionDragon"
description = '''
Аддон для Ice and Fire CE, добавляющий инструменты драконовода: шприц для сбора крови с живых драконов, обсидианово-алмазные ножницы для сбора чешуи, обезбол для безопасных процедур и исключительный драконий корм для поэтапного приручения диких драконов через систему доверия. Мод позволяет получать ресурсы без убийства драконов.

Схема Norse Hall: DarkLordKaz (модиф. Orion).
Текстуры блока и стебля драконьего фрукта: LadaVesta.
'''
credits = "Текстуры: LadaVesta (блок и стебель драконьего фрукта). Постройки: DarkLordKaz (Norse Hall)."

[[dependencies.dragoncare]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.dragoncare]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.dragoncare]]
modId = "iceandfire"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "dragoncare.mixins.json"
